# Agent X — Prometheus Configuration
# Scraped agent_x_metrics Exporter every 12 seconds

global:
  scrape_interval: 12s
  evaluation_interval: 12s

scrape_configs:
  - job_name: "agent-x"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["agent-x-metrics:9090"]
        labels:
          app: "agent-x"
          env: "production"
