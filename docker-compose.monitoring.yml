# Agent X — Monitoring Stack
# docker-compose -f docker-compose.monitoring.yml up -d
#
# Services:
#   agent-x-metrics  — Prometheus Exporter (Port 9090)
#   prometheus       — Prometheus Server (Port 9091)
#   grafana          — Grafana Dashboard (Port 3000)

version: "3.8"

services:
  # ─── Agent X Metrics Exporter ──────────────────────────────────────
  agent-x-metrics:
    image: python:3.12-slim
    container_name: agent-x-metrics
    working_dir: /app
    command: |
      sh -c "pip install --quiet -r requirements.txt && python agent_x_metrics.py --port 9090 --interval 12"
    ports:
      - "9090:9090"
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379
      - NEO4J_ENABLED=false
    restart: unless-stopped
    networks:
      - agent-x-monitoring

  # ─── Prometheus ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: agent-x-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - agent-x-monitoring

  # ─── Grafana ───────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: agent-x-grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=agentx
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - agent-x-monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  agent-x-monitoring:
    driver: bridge
