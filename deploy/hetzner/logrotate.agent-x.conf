# Agent-X logrotate — install on Hetzner (read-only gate-safe template).
#
#   sudo cp deploy/hetzner/logrotate.agent-x.conf /etc/logrotate.d/agent-x
#   sudo sed -i 's|@AGENT_X_ROOT@|/root/agent_x_storage|g' /etc/logrotate.d/agent-x
#   sudo logrotate -d /etc/logrotate.d/agent-x    # dry-run
#
# PREREQ (news_scores block): deploy code with iter_jsonl_store readers
# (load_seen, load_run_markers, last_run_marker) BEFORE enabling data rotation.
# Hourly cron opens/closes the file each run — no copytruncate needed.
# maxsize can rotate multiple times per day — epoch in dateformat avoids
# news_scores.jsonl-YYYYMMDD.N.gz collisions from same-day re-rotation.

@AGENT_X_ROOT@/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 root adm
    maxsize 100M
    dateext
    dateformat -%Y%m%d
    sharedscripts
    postrotate
        # systemctl reload agent-x >/dev/null 2>&1 || true
    endscript
}

@AGENT_X_ROOT@/data/news_scores.jsonl {
    daily
    missingok
    rotate 365
    compress
    delaycompress
    notifempty
    create 0640 root root
    maxsize 200M
    dateext
    dateformat -%Y%m%d-%s
    su root root
    sharedscripts
    postrotate
        @AGENT_X_ROOT@/.venv/bin/python @AGENT_X_ROOT@/scripts/watchdog_news_ingestion.py @AGENT_X_ROOT@/data/news_scores.jsonl >/dev/null 2>&1 || true
        for f in @AGENT_X_ROOT@/data/news_scores.jsonl-*.gz; do
            [ -f "$f" ] || continue
            gzip -t "$f" || echo "Corrupt archive: $f" | logger -t logrotate
        done
    endscript
}
