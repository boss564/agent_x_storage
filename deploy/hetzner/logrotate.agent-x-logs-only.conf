# Agent-X logrotate — logs only (Phase A, post gate-close).
#
# Install immediately after v1.3 deploy. No state readers depend on logs/*.log.
#
#   sudo cp deploy/hetzner/logrotate.agent-x-logs-only.conf /etc/logrotate.d/agent-x
#   sudo sed -i 's|@AGENT_X_ROOT@|/root/agent_x_storage|g' /etc/logrotate.d/agent-x
#   sudo logrotate -d /etc/logrotate.d/agent-x
#
# Phase B (data/news_scores.jsonl): append block from logrotate.agent-x.conf
# only after v1.3 soak (~3–7 d) — see docs/V13_DEPLOY_RUNBOOK.md §3.

@AGENT_X_ROOT@/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 root adm
    maxsize 100M
    dateext
    dateformat -%Y%m%d
    sharedscripts
    postrotate
        # systemctl reload agent-x >/dev/null 2>&1 || true
    endscript
}
