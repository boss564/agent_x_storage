apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentx.fullname" . }}-feature-flags
  labels:
    {{- include "agentx.labels" . | nindent 4 }}
data:
  ZK_TRIGGER_RATE: {{ .Values.featureFlags.zkTriggerRate | quote }}
  POISON_RATE: {{ .Values.featureFlags.poisonRate | quote }}
  COMPLEX_RATE: {{ .Values.featureFlags.complexRate | quote }}
  WITNESS_TIMEOUT_MS: {{ .Values.featureFlags.witnessTimeoutMs | quote }}
