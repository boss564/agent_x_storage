apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentx.fullname" . }}-surface
  labels:
    {{- include "agentx.labels" . | nindent 4 }}
    app.kubernetes.io/component: surface
spec:
  replicas: {{ .Values.surface.replicas }}
  selector:
    matchLabels:
      {{- include "agentx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: surface
  template:
    metadata:
      labels:
        {{- include "agentx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: surface
    spec:
      containers:
        - name: surface
          image: "{{ .Values.image.repository }}/{{ .Values.surface.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: ZK_TRIGGER_RATE
              value: {{ .Values.surface.zkTriggerRate | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.surface.metricsPort }}
          resources:
            {{- toYaml .Values.surface.resources | nindent 12 }}
