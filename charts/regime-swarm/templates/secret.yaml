{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "regime-swarm.fullname" . }}-secrets
  labels:
    {{- include "regime-swarm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.slackWebhookUrl }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.pagerdutyIntegrationKey }}
  PAGERDUTY_INTEGRATION_KEY: {{ .Values.secrets.pagerdutyIntegrationKey | quote }}
  {{- end }}
  {{- if .Values.secrets.telegramBotToken }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | quote }}
  {{- end }}
  {{- if .Values.secrets.telegramChatId }}
  TELEGRAM_CHAT_ID: {{ .Values.secrets.telegramChatId | quote }}
  {{- end }}
{{- end }}
