{{- if .Values.lease.enabled }}
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ .Values.lease.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "regime-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: leader-election
spec:
  leaseDurationSeconds: {{ .Values.lease.leaseDurationSeconds }}
{{- end }}
