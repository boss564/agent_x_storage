# Live Shadow — WebSocket → WORM → Daemon (monitoring only)
# Charter: live_execution=false · read-only · DEFENSIVE_CAUSAL_GROUNDING
#
# Usage:
#   helm upgrade --install regime-swarm charts/regime-swarm -n trading \
#     -f charts/regime-swarm/values-dev.yaml \
#     -f charts/regime-swarm/values-live-shadow.yaml
#
# Requires cluster egress to wss://stream.binance.com (or set LIVE_FEED_WS_URL).

replicaCount: 1

leaderElection:
  enabled: false

lease:
  enabled: false
  runtimeEnabled: false

smokeTest:
  enabled: false

config:
  LIVE_FEED_ENABLED: "true"
  LIVE_FEED_SYMBOL: "ETHUSDT"
  LIVE_FEED_WORM_DIR: "/data/worm/live"
  LIVE_FEED_WS_URL: "wss://stream.binance.com:9443/ws"
  CYCLE_INTERVAL_SECONDS: "30"
  SWARM_METRICS_ENABLED: "true"
  SWARM_METRICS_PORT: "8080"
  SWARM_LIVE_EXECUTION: "false"
  # Option B paper exit — §7 Amendment A1 (1s-Bars); k=4966
  PAPER_EXIT_MODE: "time_hold"
  PAPER_HOLD_SECONDS: "4966"
  PAPER_EXIT_GAP_DT_S: "30"
  PAPER_EXIT_MAX_WAIT_S: "24830"
  PAPER_POSITION_STATE_PATH: "/data/state/paper_position.json"
  PAPER_EDGES_PATH: "/data/audit/paper_edges.jsonl"
  # Position sizing (B0–B8) — default OFF; Strang B: enabled=true wenn ≥50 Fills
  # Siehe docs/POSITION_SIZING_REGIME_MAPPING.md §6–§8
  POSITION_SIZING_ENABLED: "false"
  POSITION_SIZING_GAMMA_MAP: '{"STABLE":0.25,"STABLE_SIDEWAYS":0.10,"LOW_LEVEL_DRIFT":0.20,"DRIFT_IID_UNRELIABLE":0.00,"HIGH_VOL_TREND":0.40,"HIGH_VOL_TREND_BEARISH":0.35}'
  # Trailing SIGNAL window for A2 (streaming WORM; prevents OOM on 100k+ line archives)
  SWARM_WORM_MAX_TICKS: "10000"

infrastructureGates:
  enabled: true
  G0_MAX_PRICE_CHANGE_PCT: 20
  G0_MAX_SPREAD_PCT: 5
  G25_MAX_LATENCY_MS: 500

persistence:
  enabled: true
  size: 5Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
