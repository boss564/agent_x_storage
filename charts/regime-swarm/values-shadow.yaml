# Shadow cluster overlay — namespace regime-swarm-shadow (Chaos P2/P5 + Lease runtime)
# Usage: scripts/regime_swarm_shadow_cluster.sh up

replicaCount: 2

leaderElection:
  enabled: true
  leaderOrdinal: 0

lease:
  enabled: true
  runtimeEnabled: true
  name: regime-swarm-leader
  leaseDurationSeconds: 15
  renewIntervalSeconds: 5

serviceAccount:
  create: true

image:
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  size: 2Gi
  storageClassName: standard

config:
  CYCLE_INTERVAL_SECONDS: "30"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

secrets:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1
