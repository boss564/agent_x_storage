# Agent X — Off-Grid Bunker CI/CD Pipeline
# Führt den vollständigen MPC-Bunker-Workflow bei jedem Push/PR aus.
#
# Testet:
#   1. Mock-HSM (PKCS#11-Equivalent)
#   2. MPC-Threshold-Signaturen (3/5)
#   3. LoRa-UDP-Übertragung
#   4. CBOR-Paket-Erstellung
#   5. BHO-Nullsummenprüfung (Δ=0)
#   6. Merkle-Ketten-Konsistenz
#   7. E2E: Handwerker → LoRa → Bunker → Ledger

name: Off-Grid Bunker Test + Formal Invariant Verification

on:
  push:
    branches: [main, deploy-safe-snapshot]
    paths:
      - 'agents_b2g/**'
      - 'tests/**'
      - 'scripts/test_*.py'
      # §A-ZZZZ82 (Runde 71): der Auslöser nannte seinen Gegenstand nicht.
      # `scripts/test_*.py` matcht `scripts/check_claude_md.py` nicht —
      # der Prüfer lief auf keinem Zweig, wenn nur er sich änderte.
      - 'scripts/check_claude_md.py'
      - '.github/workflows/offgrid-test.yml'
      - 'services/**'
  pull_request:
    branches: [main, deploy-safe-snapshot]
    paths:
      - 'agents_b2g/**'
      - 'tests/**'
      - 'scripts/test_wave33_survival.py'
      - 'scripts/check_claude_md.py'
      - '.github/workflows/offgrid-test.yml'
      - 'Dockerfile.bunker'
      - 'docker-compose.mock.yml'
  workflow_dispatch:
    inputs:
      run_docker:
        description: 'Run Docker Mock-Stack (vollständige 5-Bunker-Simulation)'
        type: boolean
        default: false

jobs:
  # =========================================================================
  # Job 1: Unit-Tests (schnell, ohne Docker)
  # =========================================================================

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # §A-ZZZZ86 (Runde 72): die Tests rufen `--timeout=60`, das
          # Plugin fehlte. Run 39142099847 starb daran mit
          # "unrecognized arguments". Fünf Wochen unentdeckt, weil der
          # Workflow auf diesem Zweig nie lief.
          pip install pytest pytest-timeout

      - name: Run Mock-HSM Tests
        run: |
          python -m pytest tests/test_bunker_integration.py -v \
            --tb=short \
            --timeout=60 \
            -k "TestMockHSM" \
            -p no:cacheprovider

      - name: Run Mock-LoRa Tests
        run: |
          python -m pytest tests/test_bunker_integration.py -v \
            --tb=short \
            --timeout=60 \
            -k "TestMockLoRa" \
            -p no:cacheprovider

      - name: Run Mock-Handyman Tests
        run: |
          python -m pytest tests/test_bunker_integration.py -v \
            --tb=short \
            --timeout=60 \
            -k "TestMockHandyman" \
            -p no:cacheprovider

      - name: Run Bunker Integration Tests
        run: |
          python -m pytest tests/test_bunker_integration.py -v \
            --tb=short \
            --timeout=60 \
            -k "TestBunkerIntegration" \
            -p no:cacheprovider

      - name: Run E2E Tests (local)
        run: |
          python -m pytest tests/test_bunker_e2e.py -v \
            --tb=short \
            --timeout=120 \
            -p no:cacheprovider

      - name: Test Results Summary
        if: always()
        run: |
          echo "## 🧪 Bunker Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Test Group | Tests | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mock-HSM | 6 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Mock-LoRa | 4 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Mock-Handyman | 3 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Bunker Integration | 5 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Pipeline | 14 | ✅ |" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # Job 2: Docker Mock-Stack (5 Bunker + Handwerker)
  # =========================================================================

  docker-tests:
    name: Docker Mock-Stack (5 Bunker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker || github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Bunker Image
        run: |
          docker build -f Dockerfile.bunker -t agentx-bunker:ci .

      - name: Start Mock-Stack (5 Bunker)
        run: |
          docker compose -f docker-compose.mock.yml up -d --wait --wait-timeout 30
          sleep 5
          docker compose -f docker-compose.mock.yml ps

      - name: Verify Bunker Connectivity
        run: |
          echo "Testing bunker UDP ports..."
          for port in 8881 8882 8883 8884 8885; do
            echo -n "  Port $port: "
            nc -zu localhost $port && echo "OPEN" || echo "CLOSED"
          done

      - name: Run Handyman Simulation
        run: |
          docker compose -f docker-compose.mock.yml logs handyman
          docker compose -f docker-compose.mock.yml logs bunker_01

      - name: Run Integration Tests in Container
        run: |
          docker compose -f docker-compose.mock.yml run --rm test_runner

      - name: Collect Logs
        if: always()
        run: |
          mkdir -p logs/
          docker compose -f docker-compose.mock.yml logs > logs/bunker_stack.log

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunker-logs
          path: logs/

      - name: Shutdown
        if: always()
        run: |
          docker compose -f docker-compose.mock.yml down -v
          docker system prune -f

  # =========================================================================
  # Job 3: Wave 33 Survival Cross-Test
  # =========================================================================

  survival-tests:
    name: Wave 33 Survival Cross-Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Wave 33 Tests
        run: |
          python3 scripts/test_wave33_survival.py

      - name: Run ESP32 Firmware Tests
        run: |
          python3 scripts/test_esp32_firmware.py

  # =========================================================================
  # Job 4: Smart Contract Compilation (Foundry)
  # =========================================================================

  contract-compile:
    name: Smart Contract Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Compile Contracts
        run: |
          forge build

      - name: Check Contract Sizes
        run: |
          echo "## 📜 Contract Sizes" >> $GITHUB_STEP_SUMMARY
          for f in shadow_contract_pilot/contract/*.sol; do
            lines=$(wc -l < "$f")
            echo "- $(basename $f): $lines lines" >> $GITHUB_STEP_SUMMARY
          done

  # ═══════════════════════════════════════════════════════════════════════
  # Job 5: Formal Invariant Verification (Falsifiable Checks)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # Runs the test suites that verify the architectural invariants
  # established during the Security Architecture Review:
  #
  #   F1. Friction is falsifiable: 0 < friction_eur <= value_in
  #   F2. Value is conserved: partition_ok ∧ fees_ok ∧ burns_ok
  #   F3. BHO zero-sum: |Δ| ≤ 0.01€ per ADR 2 (absolute, not volume-relative)
  #   F4. Default-deny: TacticalOfficer rejects unknown devices
  #   F5. Verifiers are fail-closed: no injected engine → reject
  #   F6. DIDRegistry: 3 failures → auto-revoke, reinstatement needs dual approval
  #   F7. Chaos resilience: 4/4 fault injection experiments pass
  #   F8. DAG integrity: all blocks cryptographically verifiable
  #
  # These checks CAN fail — they're not static assertions.
  # Each one proved red during development and was fixed.

  # §A-ZZZZ85 (Runde 72): die Wache gehoert in einen **eigenen** Job.
  #
  # Runde 71 hat den Ausloeser repariert; der Beweis-Run 39142099847
  # zeigte dann das fuenfte Glied: `formal-invariants` braucht
  # `needs: [unit-tests]` und `openzeppelin-contracts-upgradeable` — und
  # starb, bevor F8 erreicht wurde. `continue-on-error: false` schuetzt
  # nur, was erreicht wird. Eine Wache in einem Job, der unabhaengig von
  # ihr sterben kann, ist so gruen wie eine ohne Ausloeser.
  #
  # `needs: []`, nur Python-Stdlib. Der Pruefer importiert nichts
  # Fremdes; ihn hinter `openzeppelin` zu klemmen war dieselbe
  # Fehlerklasse wie der Path-Filter: eine Kopplung an etwas, das
  # unabhaengig ausfallen kann.
  pruefer:
    name: Prüfer check_claude_md — entkoppelt
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Beweis — keine Fremdabhängigkeit"
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_ci_stdonly_probe.py

      - name: F8a — Selbsttest zuerst (übergibt den Stand)
        # §A-ZZZZ91 (Runde 72): **die Reihenfolge ist die Korrektur.**
        #
        # Der Hauptlauf liest `.selftest-exit` — die Übergabe des
        # Selbsttests. Die Datei ist gitignored, existiert in CI also
        # nicht, und der Hauptlauf meldete `unbekannt`, was nach §71.74
        # rot ist. Der Job wäre **auf ewig rot** gewesen: nicht weil
        # etwas kaputt ist, sondern weil niemand übergeben hatte.
        #
        # In Runde 71 lief der Selbsttest **nach** dem Hauptlauf, im
        # selben Step. Die Reihenfolge war die Ursache.
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_claude_md.py --self-test

      - name: F8 — CLAUDE.md Consistency
        # §A-ZZZZ82: explizites `shell:` — Default ist `bash -e` ohne
        # `pipefail`. Bricht der erste Befehl ab, ja; fängt es ein später
        # angehängtes `| tee`, nein. `pipefail` schließt das.
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_claude_md.py
        continue-on-error: false

  formal-invariants:
    name: Formal Invariant Verification
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install plotly streamlit fastapi uvicorn pydantic

      - name: F1-F3 — SimChain Falsifiable Checks
        run: |
          python3 scripts/test_simchain.py
        continue-on-error: false

      - name: F4-F6 — MultiChain + DID Registry
        run: |
          python3 scripts/test_multichain.py
        continue-on-error: false

      - name: F7 — D04 Chaos Resilience (4 fault injection experiments)
        run: |
          python3 -m agents_b2g.settlement.chaos_harness
        continue-on-error: false


      - name: Summary
        run: |
          echo "## 🔐 Formal Invariant Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Invariant | Check | Verdict |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| F1 Friction falsifiable | \`0 < friction_eur <= value_in\` | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| F2 Value conserved | \`partition_ok ∧ fees_ok ∧ burns_ok\` | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| F3 BHO zero-sum (ADR 2) | \`\|Δ\| ≤ 0.01€\` (absolute) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| F4 Default-deny | Unknown device → BLOCK | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| F5 Fail-closed | No verifier → reject | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| F6 Auto-revoke + dual approval | 3 failures → REVOKED · reinstate(2) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| F7 Chaos resilience | 4/4 experiments · 0 ms downtime | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| F8 DAG integrity | Full Merkle chain verifiable | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_\"Eine Kennzahl, die nicht rot werden kann, ist keine Sicherheit.\"_" >> $GITHUB_STEP_SUMMARY

  # §A-ZZZZ97 (Runde 72): **das sechste Glied — Integration.**
  #
  # Runde 72 hat die Wache entkoppelt (`pruefer`, `needs: []`), und das war
  # richtig: sie darf nicht mit `openzeppelin` sterben. Aber sie trägt
  # dadurch **null** Information darüber, ob der Zweig deploybar ist. Ein
  # grüner Prüfer neben einem roten `contract-compile` ist die Aussage
  # „mein Instrument funktioniert", nicht „mein Patient ist gesund".
  #
  # Dieses Gate ist das einzige Signal, das `deploy-safe` heißen darf. Es
  # ist so gesund wie sein rötestes Glied — das ist der Preis dafür, daß
  # der Zweigname wieder eine Zusage ist und keine Erinnerung an eine.
  deploy-gate:
    name: "Deploy-Gate — deploy-safe heißt hier grün"
    runs-on: ubuntu-latest
    needs: [pruefer, contract-compile, unit-tests]
    if: always()
    steps:
      - name: Gate-Auswertung
        shell: bash
        run: |
          set -euo pipefail
          echo "| Glied | Ergebnis |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| pruefer | ${{ needs.pruefer.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| contract-compile | ${{ needs.contract-compile.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| unit-tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          rot=0
          for r in "${{ needs.pruefer.result }}" \
                   "${{ needs.contract-compile.result }}" \
                   "${{ needs.unit-tests.result }}"; do
            [ "$r" = "success" ] || rot=1
          done
          if [ "$rot" = "1" ]; then
            echo "## Gate rot — dieser Stand ist **nicht** deploy-safe" >> $GITHUB_STEP_SUMMARY
            echo "Gate rot: mindestens ein Glied ist nicht 'success'." >&2
            exit 1
          fi
          echo "## Gate grün — dieser Stand darf deploy-safe heißen" >> $GITHUB_STEP_SUMMARY

      - name: Deckel aus BERICHT.md (Ausnahme im Log)
        shell: bash
        run: |
          set -euo pipefail
          echo "── Deckel-Entscheidung ──────────────────────────────────────"
          grep -E "^\*\*(offen|Deckel-Entscheidung):\*\*" \
            order_execution_engine/ops/BERICHT.md \
            || echo "  BERICHT.md: kein offen-/Deckel-Feld"
          echo "────────────────────────────────────────────────────────────"
