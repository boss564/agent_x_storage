# Baustein 2 — Regime-Drift-Schwarm smoke (17 checks, Bonferroni v2 plan)
name: RaaS Regime Drift Smoke

on:
  push:
    branches: [main]
    paths:
      - 'prototypes/raas_paper_trading/regime_drift.py'
      - 'prototypes/raas_paper_trading/regime_swarm/**'
      - 'prototypes/raas_paper_trading/feed.py'
      - 'prototypes/raas_paper_trading/paper_runner.py'
      - 'scripts/raas_regime_drift_monitor.py'
      - 'scripts/test_raas_regime_drift.py'
      - 'scripts/test_live_feed_prometheus.py'
      - 'scripts/run_regime_swarm_daemon.py'
      - 'docs/RaaS_REGIME_DRIFT_PREREG.md'
      - 'Makefile'
  pull_request:
    paths:
      - 'prototypes/raas_paper_trading/regime_drift.py'
      - 'prototypes/raas_paper_trading/regime_swarm/**'
      - 'prototypes/raas_paper_trading/feed.py'
      - 'prototypes/raas_paper_trading/paper_runner.py'
      - 'scripts/raas_regime_drift_monitor.py'
      - 'scripts/test_raas_regime_drift.py'
      - 'scripts/test_live_feed_prometheus.py'
      - 'scripts/run_regime_swarm_daemon.py'
      - 'docs/RaaS_REGIME_DRIFT_PREREG.md'
      - 'Makefile'
  workflow_dispatch:

jobs:
  regime-drift-smoke:
    name: make raas-regime-drift-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gate_core dependency (numpy via kanten_ledger)
        run: pip install 'numpy>=1.26.0'

      - name: Regime drift swarm smoke (17/17)
        run: make raas-regime-drift-smoke

      - name: Live feed + Prometheus counters (mock WS)
        run: make raas-live-feed-prometheus-smoke
