name: Forbidden Words Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run self-test (checks the watcher sees violations)
        run: python tests/test_forbidden_words/test_scanner.py

      - name: Run scanner on the repo
        run: python scripts/forbidden_word_scanner.py
