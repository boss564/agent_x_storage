name: Regime Swarm Helm

on:
  push:
    paths:
      - "charts/regime-swarm/**"
      - "Dockerfile.regime-swarm"
      - "scripts/run_regime_swarm_daemon.py"
      - "scripts/helm_pod_smoke.py"
      - "scripts/run_regime_swarm_cluster_smoke.sh"
      - "scripts/run_regime_swarm_infra_smoke.py"
      - ".github/workflows/regime-swarm-helm.yml"
  pull_request:
    paths:
      - "charts/regime-swarm/**"
      - "Dockerfile.regime-swarm"
      - "scripts/run_regime_swarm_daemon.py"
      - "scripts/helm_pod_smoke.py"
      - "scripts/run_regime_swarm_cluster_smoke.sh"
      - "scripts/run_regime_swarm_infra_smoke.py"
      - ".github/workflows/regime-swarm-helm.yml"

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm lint
        run: helm lint charts/regime-swarm

      - name: Helm template (dev values)
        run: helm template regime-swarm charts/regime-swarm -f charts/regime-swarm/values-dev.yaml > /tmp/regime-swarm.yaml

      - name: Helm template (smoke test hook)
        run: helm template regime-swarm charts/regime-swarm --set smokeTest.enabled=true | grep -q "helm_pod_smoke.py"

      - name: Helm package
        run: |
          mkdir -p chart-artifacts
          helm package charts/regime-swarm --destination chart-artifacts
          ls -la chart-artifacts

      - name: Install Z3 solver (P6 smoke)
        run: pip install 'z3-solver>=4.13.0' 'numpy>=1.26.0'

      - name: P6 leader Z3 smoke
        run: PYTHONPATH=. python3 scripts/test_regime_leader_z3.py

      - name: A0/A2.5 infrastructure gates smoke
        run: PYTHONPATH=. python3 scripts/test_infrastructure_gates.py

      - name: Helm pod smoke (local)
        run: |
          export SWARM_SMOKE_WORM_DIR=/tmp/worm-smoke-ci
          export SWARM_SMOKE_AUDIT_DIR=/tmp/audit-smoke-ci
          export HELM_POD_SMOKE_SUMMARY=/tmp/pod_smoke_summary_ci.json
          PYTHONPATH=. python3 scripts/helm_pod_smoke.py

      - name: P2/P5 shadow chaos (compose)
        env:
          SHADOW_CHAOS_HEALTH_TIMEOUT_S: "240"
        run: PYTHONPATH=. python3 scripts/regime_swarm_shadow_chaos.py
