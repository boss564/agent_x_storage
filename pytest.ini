[pytest]
# Gilt für JEDEN Aufruf von pytest in diesem Baum — nicht nur für run_tests.py.
#
# Vorher war beides eine Eigenschaft des Starters: wer `pytest` direkt
# startete, bekam 11 Collection-Fehler (Paket nicht importierbar) und schrieb
# __pycache__; wer run_tests.py startete, bekam 170 grün. Derselbe Code,
# zwei Ergebnisse, abhängig vom Launcher — dieselbe Form wie etime und pyc.
#
# pythonpath: das Repo-Wurzelverzeichnis, damit `order_execution_engine`
#   importierbar ist, egal von wo pytest gestartet wird.
# cache_dir: kein .pytest_cache. `lastfailed` überlebt sonst eine
#   Schwellenänderung und ändert, welche Tests laufen.
pythonpath = .
cache_dir = /tmp/pytest-shadow-ee

# PYTHONDONTWRITEBYTECODE kann pytest.ini NICHT setzen (die Env wirkt vor dem
# Interpreterstart). Der Zeuge dafür ist test_no_bytecode_leaks_from_this_suite:
# er prüft, ob __pycache__ existiert, und schlägt fehl, wenn ja — unter
# jedem Starter. Getragen wird es von run_tests.py (setzt die Variable vor
# dem Import) und von der Konvention `PYTHONPATH=. python3 -B -m pytest`.
